<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Articles - Almeera Catering</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-3xl font-bold mb-6">Test Artikel Supabase</h1>

      <button
        id="test-connection"
        class="bg-blue-600 text-white px-4 py-2 rounded mb-4"
      >
        Test Koneksi Supabase
      </button>

      <button
        id="load-articles"
        class="bg-green-600 text-white px-4 py-2 rounded mb-4 ml-2"
      >
        Load Artikel
      </button>

      <div id="status" class="mb-4 p-4 rounded"></div>

      <div
        id="articles-container"
        class="grid grid-cols-1 md:grid-cols-2 gap-4"
      >
        <!-- Articles will be loaded here -->
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // Supabase Setup
      const supabaseUrl = "https://nmdmriudkchtmdjkgnye.supabase.co";
      const supabaseKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tZG1yaXVka2NodG1kamtnbnllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1ODUwODMsImV4cCI6MjA3NDE2MTA4M30.LnZrN6eYdAdbbWtDo_8vsWDqJ74NOGkBGjagKFdqoXo";

      const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

      const statusDiv = document.getElementById("status");
      const articlesContainer = document.getElementById("articles-container");

      function showStatus(message, type = "info") {
        statusDiv.className = `mb-4 p-4 rounded ${type === "error" ? "bg-red-100 text-red-700" : type === "success" ? "bg-green-100 text-green-700" : "bg-blue-100 text-blue-700"}`;
        statusDiv.textContent = message;
      }

      document
        .getElementById("test-connection")
        .addEventListener("click", async () => {
          showStatus("Testing koneksi Supabase...", "info");

          try {
            const { data, error } = await supabase
              .from("articles")
              .select("count")
              .limit(1);

            if (error) {
              showStatus(`Error: ${error.message}`, "error");
            } else {
              showStatus("Koneksi Supabase berhasil!", "success");
            }
          } catch (err) {
            showStatus(`Error: ${err.message}`, "error");
          }
        });

      document
        .getElementById("load-articles")
        .addEventListener("click", async () => {
          showStatus("Loading artikel...", "info");

          try {
            const { data, error } = await supabase
              .from("articles")
              .select("*")
              .order("created_at", { ascending: false });

            if (error) {
              showStatus(`Error loading articles: ${error.message}`, "error");
              return;
            }

            showStatus(`Berhasil load ${data.length} artikel!`, "success");

            articlesContainer.innerHTML = "";

            data.forEach((article) => {
              const articleDiv = document.createElement("div");
              articleDiv.className = "bg-white p-4 rounded-lg shadow";
              articleDiv.innerHTML = `
                        <h3 class="font-bold text-lg mb-2">${article.title}</h3>
                        <p class="text-gray-600 text-sm mb-2">By ${article.author} • ${article.category}</p>
                        <p class="text-gray-700">${article.content.substring(0, 150)}...</p>
                        <p class="text-xs text-gray-500 mt-2">Published: ${article.is_published ? "Yes" : "No"}</p>
                    `;
              articlesContainer.appendChild(articleDiv);
            });
          } catch (err) {
            showStatus(`Error: ${err.message}`, "error");
          }
        });
    </script>
  </body>
</html>
