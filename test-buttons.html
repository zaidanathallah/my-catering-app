<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Tombol Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-4">Test Tombol Admin Dashboard</h1>

    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-xl font-bold mb-4">Test Tombol Dasar</h2>

      <div class="space-y-4">
        <button
          id="test-btn-1"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
        >
          Test Button 1
        </button>

        <button
          id="test-btn-2"
          class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
        >
          Test Button 2
        </button>

        <button
          id="test-btn-3"
          class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700"
        >
          Test Button 3
        </button>
      </div>

      <div id="test-result" class="mt-4 p-4 bg-gray-50 rounded">
        <p>Klik tombol di atas untuk test...</p>
      </div>
    </div>

    <!-- Test Tab Buttons -->
    <div class="bg-white rounded-lg shadow p-6">
      <h2 class="text-xl font-bold mb-4">Test Tab Buttons</h2>

      <div class="flex space-x-4 mb-4">
        <button
          class="tab-btn active py-2 px-4 border-b-2 border-blue-500 text-blue-600 font-medium"
          data-tab="menu"
        >
          Menu Makanan
        </button>
        <button
          class="tab-btn py-2 px-4 border-b-2 border-transparent text-gray-500 hover:text-gray-700"
          data-tab="articles"
        >
          Artikel & Berita
        </button>
        <button
          class="tab-btn py-2 px-4 border-b-2 border-transparent text-gray-500 hover:text-gray-700"
          data-tab="testimonials"
        >
          Testimoni
        </button>
      </div>

      <div id="tab-result" class="p-4 bg-gray-50 rounded">
        <p>Klik tab di atas untuk test...</p>
      </div>
    </div>

    <script>
      console.log("Test buttons script loaded");

      // Test basic buttons
      document
        .getElementById("test-btn-1")
        .addEventListener("click", function () {
          console.log("Button 1 clicked");
          document.getElementById("test-result").innerHTML =
            '<p class="text-green-600">✅ Button 1 berhasil diklik!</p>';
        });

      document
        .getElementById("test-btn-2")
        .addEventListener("click", function () {
          console.log("Button 2 clicked");
          document.getElementById("test-result").innerHTML =
            '<p class="text-blue-600">✅ Button 2 berhasil diklik!</p>';
        });

      document
        .getElementById("test-btn-3")
        .addEventListener("click", function () {
          console.log("Button 3 clicked");
          document.getElementById("test-result").innerHTML =
            '<p class="text-red-600">✅ Button 3 berhasil diklik!</p>';
        });

      // Test tab buttons
      const tabBtns = document.querySelectorAll(".tab-btn");
      console.log("Found tab buttons:", tabBtns.length);

      tabBtns.forEach((btn, index) => {
        console.log(
          `Setting up tab button ${index}:`,
          btn.getAttribute("data-tab"),
        );
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          console.log("Tab clicked:", btn.getAttribute("data-tab"));

          const tabName = btn.getAttribute("data-tab");

          // Update active tab
          tabBtns.forEach((b) => {
            b.classList.remove("active", "border-blue-500", "text-blue-600");
            b.classList.add("border-transparent", "text-gray-500");
          });
          btn.classList.add("active", "border-blue-500", "text-blue-600");
          btn.classList.remove("border-transparent", "text-gray-500");

          // Update result
          document.getElementById("tab-result").innerHTML =
            `<p class="text-green-600">✅ Tab "${tabName}" berhasil diklik!</p>`;
        });
      });

      console.log("All event listeners set up");
    </script>
  </body>
</html>
