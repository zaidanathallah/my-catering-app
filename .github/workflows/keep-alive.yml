name: Supabase Keep Alive

on:
  schedule:
    # Berjalan setiap hari pada jam 18:00 UTC (01:00 WIB tengah malam)
    - cron: '0 18 * * *'
  workflow_dispatch: # Memungkinkan trigger manual jika diperlukan

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database to Prevent Pause
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL atau SUPABASE_ANON_KEY belum di-set di GitHub Secrets. Melewati ping."
            exit 0
          fi
          echo "Pinging Supabase REST API..."
          curl -s -X GET "${SUPABASE_URL}/rest/v1/menus?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo ""
          echo "Supabase ping selesai."
