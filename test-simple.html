<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Simple Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-4">Test Koneksi Supabase - Menu</h1>

    <div id="status" class="mb-4 p-4 rounded bg-blue-100">
      <p>Memuat...</p>
    </div>

    <div
      id="menu-container"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
    >
      <!-- Menu akan dimuat di sini -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      console.log("Script dimulai...");

      // Tunggu sampai Supabase library loaded
      function waitForSupabase() {
        return new Promise((resolve) => {
          if (window.supabase) {
            resolve();
          } else {
            setTimeout(() => waitForSupabase().then(resolve), 100);
          }
        });
      }

      async function main() {
        try {
          console.log("Menunggu Supabase library...");
          await waitForSupabase();

          console.log("Supabase library loaded:", window.supabase);

          const supabaseUrl = "https://brbguarxgdocstqejnqm.supabase.co";
          const supabaseKey =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyYmd1YXJ4Z2RvY3N0cWVqbnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Mzg4MzQsImV4cCI6MjA5NDUxNDgzNH0.iay49VK7sI2vHiYuPSS8PygeGSVk4pIatjSGYPAJ7j0";

          const supabase = window.supabase.createClient(
            supabaseUrl,
            supabaseKey,
          );
          console.log("Supabase client created:", supabase);

          document.getElementById("status").innerHTML =
            '<p class="text-blue-600">Menghubungkan ke database...</p>';

          // Test koneksi
          const { data: menuData, error } = await supabase
            .from("menus")
            .select("*")
            .limit(6);

          if (error) {
            console.error("Error:", error);
            document.getElementById("status").innerHTML =
              `<p class="text-red-600">Error: ${error.message}</p>`;
            return;
          }

          console.log("Data berhasil dimuat:", menuData);
          document.getElementById("status").innerHTML =
            `<p class="text-green-600">Berhasil! Memuat ${menuData.length} menu</p>`;

          // Tampilkan menu
          const container = document.getElementById("menu-container");
          container.innerHTML = "";

          menuData.forEach((menu) => {
            const menuCard = document.createElement("div");
            menuCard.className = "bg-white rounded-lg shadow-md p-4";
            menuCard.innerHTML = `
                        <img src="${menu.image_url || "https://via.placeholder.com/300x200"}" 
                             alt="${menu.name}" 
                             class="w-full h-32 object-cover rounded mb-3"
                             onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                        <h3 class="font-bold text-lg mb-2">${menu.name}</h3>
                        <p class="text-gray-600 text-sm mb-2">${menu.description}</p>
                        <p class="text-green-600 font-bold">Rp ${parseInt(menu.price).toLocaleString()}</p>
                        <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded mt-2">${menu.category}</span>
                    `;
            container.appendChild(menuCard);
          });
        } catch (error) {
          console.error("Catch error:", error);
          document.getElementById("status").innerHTML =
            `<p class="text-red-600">Catch Error: ${error.message}</p>`;
        }
      }

      // Jalankan setelah DOM ready
      document.addEventListener("DOMContentLoaded", main);
    </script>
  </body>
</html>
